<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<!--
=====================================================================
 Enjoy Coffee - إدلب  |  ملف واحد (HTML + CSS + JS)
=====================================================================
 [1] لوحة التحكم:
   - الزر مخبأ داخل رمز حقوق النشر (©) في أسفل التذييل (الـ footer).
   - اضغط على علامة © ← تظهر نافذة الرمز ← أدخل الرمز التجريبي: 1234
   - لتغيير الرمز: ابحث في كود JS عن  ADMIN_PIN  وعدّل قيمته.
   - التعديلات تُحفظ في localStorage (على هذا المتصفح فقط).

 [2] استبدال الصور والروابط:
   - الشعار logo والصورة الرئيسية main img: مدمجتان داخل الملف كبيانات base64.
     للاستبدال ابحث في JS عن  const IMG  وضع اسم الملف، مثل:  logo:"logo.jpeg"
     (وضع الملف بجانب index.html) أو أي رابط صورة.
   - صور الأصناف: من لوحة التحكم ← حقل "رابط الصورة"، أو داخل مصفوفة DEF.items (img:"").
     إن بقي الحقل فارغاً أو فشل التحميل تظهر خلفية بديلة أنيقة.
   - صور المعرض: في مصفوفة GALLERY (حقل src) ونصوصها البديلة alt/cap.
   - الهاتف، الواتساب، البريد، العنوان، الخريطة، السوشيال: الكائن CONFIG (أو من لوحة التحكم).
     رقم الواتساب بصيغة دولية بدون + مثل: 905xxxxxxxxx  — إن كان فارغاً يظهر تنبيه بدل فتح رابط وهمي.
     رابط الخريطة: رابط Google Maps المؤكد للمقهى. الروابط الفارغة تُخفى تلقائياً.

 [3] ربط Supabase (تحديث حي لجميع زبائن الـ QR) - خطوة بخطوة:
   1) أنشئ مشروعاً مجانياً في supabase.com.
   2) من SQL Editor نفّذ:
        create table menu_data (id int primary key, data jsonb not null, updated_at timestamptz default now());
        insert into menu_data values (1,'{}');
        alter table menu_data enable row level security;
        create policy "read" on menu_data for select using (true);
        -- الكتابة: أنشئ مستخدم Auth للمالك وأضف سياسة update لـ authenticated فقط.
   3) فعّل Realtime للجدول: Database ← Replication ← menu_data.
   4) من Project Settings ← API انسخ URL و anon key وضعهما في SUPABASE أدناه.
   5) أضف قبل </body> :  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   6) فعّل الدالتين supaLoad() و supaSave() و supaSubscribe() الموجودتين في JS (أزل التعليق).
   النتيجة: كل تعديل في لوحة التحكم يُرفع للقاعدة، والزبائن يتحدثون تلقائياً عبر Realtime.
=====================================================================
-->
<style>
:root{--purple:#4b2145;--deep:#2d1229;--plum:#6b2d5c;--cream:#f8f1e7;--gold:#c9a96a;--bg:#f8f1e7;--surf:#fff;--surf2:#f1e7d9;--tx:#2a1427;--tx2:#6d5a68;--bd:#e3d6c3;--sh:0 6px 22px rgba(45,18,41,.10);--hb:rgba(248,241,231,.94);--acc:#4b2145;--accx:#fff;--goldt:#8f6d2c;--r:14px;--hh:68px}
[data-theme=dark]{--bg:#1a0c18;--surf:#2a1427;--surf2:#34193a;--tx:#f5ebdc;--tx2:#c4b2bb;--bd:#47294a;--sh:0 6px 22px rgba(0,0,0,.45);--hb:rgba(26,12,24,.94);--acc:#c9a96a;--accx:#2d1229;--goldt:#d8bd86}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:var(--hh)}
body{background:var(--bg);color:var(--tx);font:400 16px/1.75 Cairo,"Noto Sans Arabic",Tahoma,sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
[lang=en] body{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;line-height:1.6}
[lang=en] h1,[lang=en] h2,[lang=en] h3{font-family:"Cormorant Garamond",Georgia,serif}
body.lock{overflow:hidden}img{max-width:100%;display:block}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}a{color:inherit}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
#prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:60;background:linear-gradient(90deg,var(--gold),var(--plum));transform-origin:left;transform:scaleX(0)}[dir=rtl] #prog{transform-origin:right}
header{position:sticky;top:0;z-index:50;height:var(--hh);transition:.3s;background:transparent}
header.sc{background:var(--hb);box-shadow:0 1px 0 var(--bd),var(--sh);backdrop-filter:blur(8px)}
header .wrap{display:flex;align-items:center;gap:12px;height:100%}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1.25rem "Cormorant Garamond",serif;margin-inline-end:auto}
.lg{width:46px;height:46px;border-radius:12px;background:var(--purple);overflow:hidden;flex:none;display:grid;place-items:center}.lg img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen}
nav.d{display:none;gap:4px}nav a{text-decoration:none;padding:6px 12px;border-radius:10px;font-size:.95rem;color:var(--tx2);transition:.2s}
nav a:hover{color:var(--tx)}nav a.on{color:var(--goldt);box-shadow:inset 0 -2px var(--gold)}
header.top:not(.sc) .brand,header.top:not(.sc) nav a,header.top:not(.sc) .ib{color:#fff}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--bd);background:var(--surf);transition:.2s}header.top:not(.sc) .ib{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.ib:hover{transform:translateY(-2px);border-color:var(--gold)}.lgb{width:auto;padding:0 12px;font-weight:700;font-size:.9rem}
.burger{display:grid}
@media(min-width:900px){nav.d{display:flex}.burger{display:none}}
.drawer{position:fixed;inset:0;z-index:70;visibility:hidden;opacity:0;transition:.25s}.drawer.open{visibility:visible;opacity:1}
.drawer .bk{position:absolute;inset:0;background:rgba(20,6,18,.6)}
.drawer .pn{position:absolute;top:0;bottom:0;right:0;width:min(300px,82%);background:var(--surf);padding:20px;display:flex;flex-direction:column;gap:6px;transform:translateX(100%);transition:.3s}
[dir=ltr] .drawer .pn{right:auto;left:0;transform:translateX(-100%)}.drawer.open .pn{transform:none}
.pn a{padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:600}.pn a.on{background:var(--surf2);color:var(--goldt)}
.hero{position:relative;margin-top:calc(var(--hh) * -1);min-height:100svh;display:grid;align-items:center;color:#fff;overflow:hidden;background:var(--deep)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;animation:zoom 14s ease-out both}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 100%,rgba(45,18,41,.98),rgba(75,33,69,.72) 55%,rgba(75,33,69,.55)),linear-gradient(180deg,rgba(45,18,41,.55),rgba(45,18,41,.85));backdrop-filter:blur(1.5px)}
.hero .wrap{position:relative;z-index:2;padding:110px 0 70px;max-width:760px}
.kick{color:var(--gold);font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:10px}.kick:before{content:"";width:34px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(1.9rem,6.4vw,3.4rem);line-height:1.45;font-weight:700}.hero h1 em{font-style:normal;color:var(--gold)}
.hero h2{font:500 italic clamp(1.1rem,3.4vw,1.5rem)/1.4 "Cormorant Garamond",serif;color:#e9dcc6;margin:12px 0}
.hero p{color:#eadfe8;max-width:52ch;margin-bottom:26px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:700;text-decoration:none;transition:.2s;border:1.5px solid transparent}
.btn svg{transition:transform .2s}.btn:hover svg{transform:translateX(3px)}[dir=rtl] .btn:hover svg{transform:translateX(-3px)}.btn:active{transform:scale(.97)}
.b1{background:var(--gold);color:var(--deep)}.b1:hover{box-shadow:0 8px 22px rgba(201,169,106,.4)}
.b2{border-color:rgba(255,255,255,.6);color:#fff}.b2:hover{background:rgba(255,255,255,.14)}
.bp{background:var(--acc);color:var(--accx)}.bo{border-color:var(--bd);background:var(--surf)}
section.s{padding:84px 0}.sh{max-width:640px;margin-bottom:32px}
.sh h2{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.4;color:var(--tx)}.sh p{color:var(--tx2)}.sh .kick{color:var(--goldt)}.sh .kick:before{background:var(--goldt)}
.story{display:grid;gap:28px;align-items:center}@media(min-width:860px){.story{grid-template-columns:1fr 1fr;gap:48px}}
.story .ph{border-radius:22px;overflow:hidden;box-shadow:var(--sh);aspect-ratio:4/3;background:var(--purple)}.ph img{width:100%;height:100%;object-fit:cover}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(45,18,41,.18)}
.feat{padding:16px}.feat svg{width:26px;height:26px;color:var(--goldt);margin-bottom:6px}.feat b{display:block}.feat span{color:var(--tx2);font-size:.88rem;line-height:1.5;display:block}
.bar{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--surf);font-weight:600;font-size:.92rem;transition:.2s;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.srch{position:relative}.srch svg{position:absolute;top:50%;translate:0 -50%;inset-inline-start:14px;color:var(--tx2)}
.srch input{width:100%;padding:12px 14px;padding-inline-start:42px;border-radius:12px;border:1px solid var(--bd);background:var(--surf);color:var(--tx);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pc{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pi{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,var(--purple),var(--plum));display:grid;place-items:center;color:var(--gold)}
.pi svg.i{width:46px;height:46px;opacity:.75}.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}.pc:hover .pi img{transform:scale(1.06)}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--gold);color:var(--deep);font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:8px;z-index:2}
.pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}.pb h3{font-size:1.12rem;line-height:1.35;overflow-wrap:anywhere}
.pb p{color:var(--tx2);font-size:.9rem;line-height:1.55;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--tx2);align-items:center}
.st{padding:1px 10px;border-radius:999px;font-weight:600;background:rgba(60,140,90,.15);color:#2e7d4f}[data-theme=dark] .st{color:#7fd6a0}.st.off{background:rgba(180,60,60,.15);color:#b03a3a}[data-theme=dark] .st.off{color:#ff9a9a}
.pr{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--bd)}.pr span{font-weight:700;font-size:.88rem;color:var(--goldt);background:var(--surf2);padding:2px 9px;border-radius:8px;direction:ltr}
.pc.off .pi,.pc.off h3{opacity:.55}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;border:1.5px dashed var(--bd);border-radius:var(--r);color:var(--tx2)}.empty svg{width:40px;height:40px;color:var(--goldt)}
.more{text-align:center;margin-top:24px}
.offers{display:grid;gap:16px}@media(min-width:760px){.offers{grid-template-columns:repeat(3,1fr)}}
.of{padding:22px}.of svg{width:32px;height:32px;color:var(--goldt)}.of h3{margin:8px 0 4px}.of p{color:var(--tx2);font-size:.94rem}.of strong{display:inline-block;margin-top:12px;background:var(--acc);color:var(--accx);padding:4px 14px;border-radius:8px}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gal button{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;background:linear-gradient(135deg,var(--purple),var(--plum));display:block;width:100%}
.gal button:first-child{grid-column:1/-1;aspect-ratio:16/9}
@media(min-width:760px){.gal{grid-template-columns:repeat(4,1fr)}.gal button:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s;position:absolute;inset:0}.gal button:hover img{transform:scale(1.07)}
.gal button:after{content:"";position:absolute;inset:0;background:rgba(45,18,41,.0);transition:.3s}.gal button:hover:after{background:rgba(45,18,41,.45)}
.gal .zi{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:0;transition:.3s;z-index:2}.gal button:hover .zi,.gal button:focus-visible .zi{opacity:1}.zi svg{width:34px;height:34px}
.ct{background:linear-gradient(145deg,var(--deep),var(--purple) 60%,var(--plum));color:#f5ebdc;border-radius:26px;padding:28px 22px;display:grid;gap:26px;box-shadow:var(--sh)}
@media(min-width:800px){.ct{grid-template-columns:1fr 1fr;padding:44px}}
.ct h2{font-size:1.9rem;line-height:1.3}.ct p{color:#d9c8d3}.rows{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.08);text-decoration:none;min-width:0;overflow-wrap:anywhere}.row svg{color:var(--gold)}a.row:hover{background:rgba(255,255,255,.16)}
.mapph{border:1.5px dashed rgba(255,255,255,.35);border-radius:14px;padding:16px;text-align:center;color:#d9c8d3;font-size:.9rem;margin-top:14px}
.soc{display:flex;gap:10px;flex-wrap:wrap}
footer{background:var(--deep);color:#d9c8d3;padding:42px 0 22px}footer .wrap{display:grid;gap:22px}
@media(min-width:800px){footer .wrap{grid-template-columns:1.3fr 1fr 1fr}}
footer h4{color:var(--gold);margin-bottom:8px}footer ul{list-style:none;padding:0;display:grid;gap:4px}footer a{text-decoration:none}footer a:hover{color:#fff}
.cp{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.14);padding-top:16px;font-size:.85rem;text-align:center}
#adm{background:none;border:0;color:inherit;font:inherit;padding:0 2px;cursor:default;opacity:1}#adm:focus-visible{outline:1px dotted var(--gold)}
.wa{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));inset-inline-start:16px;z-index:40;width:54px;height:54px;border-radius:50%;background:#25a75a;color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:.2s}.wa:hover{transform:scale(1.07)}.wa svg{width:26px;height:26px}
.mod{position:fixed;inset:0;z-index:90;background:rgba(20,6,18,.66);display:grid;place-items:center;padding:14px;visibility:hidden;opacity:0;transition:.25s}.mod.open{visibility:visible;opacity:1}
.box{background:var(--surf);color:var(--tx);border-radius:20px;width:min(760px,100%);max-height:92svh;overflow:auto;padding:22px;transform:translateY(14px);transition:.25s}.mod.open .box{transform:none}
.box.sm{width:min(340px,100%)}.box h3{margin-bottom:12px}
.fld{display:grid;gap:4px;margin-bottom:10px;font-size:.9rem}.fld input,.fld select,.fld textarea{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs .chip{font-size:.85rem}
.li{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ib{width:36px;height:36px}.err{color:#c0392b;font-size:.85rem;min-height:1.2em}
#lb{background:rgba(15,4,13,.92)}#lb figure{position:relative;width:min(960px,100%);text-align:center;color:#fff}#lb img{max-height:76svh;margin:auto;border-radius:12px;object-fit:contain;background:var(--purple);min-height:200px}
#lb figcaption{margin-top:10px}.lbn{position:absolute;top:45%;background:rgba(255,255,255,.18);color:#fff}.lbn.p{inset-inline-start:6px}.lbn.n{inset-inline-end:6px}.lbx{position:absolute;top:-4px;inset-inline-end:0;background:rgba(255,255,255,.18);color:#fff;z-index:3}
#toast{position:fixed;bottom:84px;left:50%;translate:-50% 20px;background:var(--deep);color:#fff;padding:10px 18px;border-radius:12px;z-index:120;opacity:0;pointer-events:none;transition:.3s;max-width:92%;text-align:center;border:1px solid var(--gold)}#toast.on{opacity:1;translate:-50% 0}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s;transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="prog"></div>

</div></section>

 <div><h2 data-i="c_h"></h2><p data-i="c_p" style="margin:8px 0 16px"></p><div class="rows" id="hrs"></div><div class="mapph" id="mapph"></div></div>

</div></div></section>

function paintIcons(r=document){r.querySelectorAll("[data-ic]").forEach(e=>{const n=e.dataset.ic;if(e.tagName==="svg"){e.setAttribute("viewBox","0 0 24 24");e.innerHTML=IC[n]}else e.innerHTML=ic(n)})}
function applyStatic(){
 const h=document.documentElement;h.lang=lang;h.dir=lang==="ar"?"rtl":"ltr";h.dataset.theme=theme;
 $$("[data-i]").forEach(e=>{const k=e.dataset.i;if(typeof t(k)==="string"){e.dataset.h!==undefined?e.innerHTML=t(k):e.textContent=t(k)}});
 $$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 $$("[data-logo]").forEach(e=>e.src=IMG.logo);$$("[data-main]").forEach(e=>e.src=IMG.main);

 const links=ids.map((id,i)=>`<a href="#${id}" data-id="${id}">${t("nav")[i]}</a>`).join("");$("#nav").innerHTML=links;$("#nav2").innerHTML=links;
 $("#lang").textContent=t("lang");$("#lang").setAttribute("aria-label",lang==="ar"?"Switch to English":"التبديل إلى العربية");
 $("#theme").innerHTML=ic(theme==="dark"?"sun":"moon");$("#theme").setAttribute("aria-label",theme==="dark"?t("light"):t("dark"));$("#theme").setAttribute("aria-pressed",theme==="dark");
 $("#bg").setAttribute("aria-label",t("menu"));$("#drx").setAttribute("aria-label",t("close"));
 $("#feats").innerHTML=t("feats").map((f,i)=>`<div class="card feat rv" style="--d:${i*.08}s">${ic(f[0])}<b>${f[1]}</b><span>${f[2]}</span></div>`).join("");
 $("#offg").innerHTML=DB.offers.map((o,i)=>`<div class="card of rv" style="--d:${i*.1}s">${ic(o.ic)}<h3>${esc(L(o)&&lang==="ar"?o.ar:o.en)}</h3><p>${esc(lang==="ar"?o.dar:o.den)}</p><strong>${esc(lang==="ar"?o.lar:o.len)}</strong></div>`).join("");
 $("#gal").innerHTML=GALLERY.map((g,i)=>`<button class="rv" style="--d:${i*.07}s" data-g="${i}" aria-label="${esc(lang==="ar"?g.ar:g.en)}"><img src="${esc(safeUrl(g.src)||IMG.main)}" alt="${esc(lang==="ar"?g.ar:g.en)}" style="object-position:${g.pos}" loading="lazy" onerror="this.style.display='none'"><span class="zi">${ic("zoom")}</span></button>`).join("");
 contact();footer();paintIcons();observe();setActive();
}
function contact(){const c=CONFIG;
 $("#hrs").innerHTML=`<div class="row">${ic("pin")}<span>${esc(L(c.address))}</span></div><div class="row">${ic("clock")}<span>${esc(L(c.hours))}</span></div>`;
 const r=[];if(c.phone)r.push(`<a class="row" href="tel:${esc(c.phone)}">${ic("phone")}<span dir="ltr">${esc(c.phone)}</span></a>`);
 if(c.whatsapp)r.push(`<a class="row" href="https://wa.me/${esc(c.whatsapp)}" target="_blank" rel="noopener">${ic("msg")}<span>${t("wa")}</span></a>`);
 if(c.email)r.push(`<a class="row" href="mailto:${esc(c.email)}">${ic("mail")}<span>${esc(c.email)}</span></a>`);
 if(c.maps)r.push(`<a class="row" href="${esc(safeUrl(c.maps))}" target="_blank" rel="noopener">${ic("map")}<span>${t("open")}</span></a>`);
 if(c.social.instagram)r.push(`<a class="row" href="${esc(safeUrl(c.social.instagram))}" target="_blank" rel="noopener">${ic("ig")}<span>Instagram</span></a>`);
 if(c.social.facebook)r.push(`<a class="row" href="${esc(safeUrl(c.social.facebook))}" target="_blank" rel="noopener">${ic("fb")}<span>Facebook</span></a>`);
 r.unshift(`<div class="row">${ic("phone")}<span>${c.phone?"":(lang==="ar"?"رقم الهاتف: يُضاف لاحقاً (تجريبي)":"Phone: to be added (sample)")}</span></div>`);if(c.phone)r.shift();
 $("#crow").innerHTML=r.join("");
 $("#mapph").innerHTML=c.maps?`<a class="btn b1" href="${esc(safeUrl(c.maps))}" target="_blank" rel="noopener">${ic("map")} ${t("open")}</a>`:`${ic("map")}<div>${t("open")}</div><small>${t("nomap")}</small>`;}
function footer(){$("#flinks").innerHTML=["home","story","menu","offers","gallery","contact"].map((id,i)=>`<li><a href="#${id}">${t("nav")[i]}</a></li>`).join("");
 const s=CONFIG.social,o=[];if(s.instagram)o.push(`<a class="ib" href="${esc(safeUrl(s.instagram))}" target="_blank" rel="noopener" aria-label="Instagram">${ic("ig")}</a>`);if(s.facebook)o.push(`<a class="ib" href="${esc(safeUrl(s.facebook))}" target="_blank" rel="noopener" aria-label="Facebook">${ic("fb")}</a>`);
 $("#fsoc").innerHTML=o.join("")||`<small>${lang==="ar"?"تُضاف الروابط قبل الإطلاق":"Links to be added before launch"}</small>`;$("#yr").textContent=new Date().getFullYear();}
function renderMenu(){
 $("#cats").innerHTML=[{id:"all",ar:t("all"),en:t("all")},...DB.cats].map(c=>`<button class="chip ${c.id===cat?"on":""}" role="tab" aria-selected="${c.id===cat}" data-c="${c.id}">${c.ic?ic(c.ic):""}${esc(L(c))}</button>`).join("");
 const q=term.trim().toLowerCase();
 const list=DB.items.filter(p=>(cat==="all"||p.cat===cat)&&(!q||(p.ar+" "+p.en).toLowerCase().includes(q)));
 const cl=id=>DB.cats.find(c=>c.id===id)||{ar:"",en:"",ic:"coffee"};const LIM=6;
 const vis=showAll||list.length<=LIM?list:list.slice(0,LIM);
 $("#grid").innerHTML=vis.length?vis.map(p=>{const c=cl(p.cat),u=safeUrl(p.img),b=p.badge?`<span class="badge">${t(p.badge)}</span>`:"";
  return `<article class="card pc ${p.on?"":"off"}"><div class="pi">${ic(c.ic||"coffee")}${u?`<img src="${esc(u)}" alt="${esc(lang==="ar"?p.ar:p.en)}" loading="lazy" onerror="this.remove()">`:""}${b}</div><div class="pb"><h3>${esc(lang==="ar"?p.ar:p.en)}</h3><p>${esc(lang==="ar"?p.dar:p.den)}</p><div class="meta"><span>${esc(L(c))}</span><span class="st ${p.on?"":"off"}">${p.on?t("on"):t("off")}</span></div><div class="pr"><span>$ ${esc(p.usd)}</span><span>₺ ${esc(p.try)}</span><span>${esc(p.syp)} SYP</span></div></div></article>`}).join(""):`<div class="empty">${ic("search")}<p>${t("none")}</p></div>`;
 const m=$("#more");m.style.display=list.length>LIM?"":"none";m.textContent=showAll?t("less"):t("more");m.setAttribute("aria-expanded",showAll);}

let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});$$(".rv:not(.in)").forEach(e=>io.observe(e))}

   const o={cat:v("f_cat"),ar:v("f_ar"),en:v("f_en"),dar:v("f_dar"),den:v("f_den"),usd:v("f_usd"),try:v("f_try"),syp:v("f_syp"),img:v("f_img"),badge:v("f_bd"),on:v("f_on")==="1"};
   if(editId===0)DB.items.push({id:Date.now(),...o});else Object.assign(DB.items.find(i=>i.id===editId),o);save();editId=null;renderMenu();adm();toast(t("a_saved"))}}
  else{b.innerHTML=`<button class="btn bp" id="nw" style="margin-bottom:12px">${ic("plus")} ${t("a_add")}</button>`+DB.items.map(p=>`<div class="li"><span>${esc(lang==="ar"?p.ar:p.en)}</span><button class="ib" data-e="${p.id}" aria-label="Edit">${ic("edit")}</button><button class="ib" data-o="${p.id}" aria-label="${t("off")}">${ic(p.on?"ban":"check")}</button><button class="ib" data-d="${p.id}" aria-label="${t("a_del")}">${ic("trash")}</button></div>`).join("");
   $("#nw").onclick=()=>{editId=0;adm()};
   b.onclick=e=>{const x=e.target.closest("button");if(!x)return;const d=x.dataset;
    if(d.e){editId=+d.e;adm()}else if(d.o){const p=DB.items.find(i=>i.id==d.o);p.on=!p.on;save();renderMenu();adm()}else if(d.d&&confirm(t("a_sure"))){DB.items=DB.items.filter(i=>i.id!=d.d);save();renderMenu();adm()}}}}
 else if(atab===1){b.innerHTML=`<div class="two" style="align-items:end">${F("c_ar",t("a_nar"))}${F("c_en",t("a_nen"))}</div><button class="btn bp" id="cadd" style="margin-bottom:12px">${ic("plus")} ${t("a_addc")}</button>`+DB.cats.map(c=>`<div class="li"><span>${esc(c.ar)} / ${esc(c.en)}</span><button class="ib" data-e="${c.id}" aria-label="Edit">${ic("edit")}</button><button class="ib" data-d="${c.id}" aria-label="${t("a_del")}">${ic("trash")}</button></div>`).join("");
  $("#cadd").onclick=()=>{const a=$("#c_ar").value.trim(),e=$("#c_en").value.trim();if(!a||!e)return toast(t("a_req"));DB.cats.push({id:"c"+Date.now(),ar:a,en:e,ic:"coffee"});save();renderMenu();adm()};
  b.onclick=e=>{const x=e.target.closest("button");if(!x)return;const d=x.dataset;
   if(d.e){const c=DB.cats.find(k=>k.id===d.e);$("#c_ar").value=c.ar;$("#c_en").value=c.en;$("#cadd").onclick=()=>{const a=$("#c_ar").value.trim(),n=$("#c_en").value.trim();if(!a||!n)return toast(t("a_req"));c.ar=a;c.en=n;save();renderMenu();adm()}}
   else if(d.d&&confirm(t("a_sure"))){DB.cats=DB.cats.filter(k=>k.id!==d.d);DB.items=DB.items.filter(i=>i.cat!==d.d);if(cat===d.d)cat="all";save();renderMenu();adm()}}}
 else if(atab===2){b.innerHTML=DB.offers.map((o,i)=>`<div class="card" style="padding:12px;margin-bottom:10px"><div class="two">${F("o"+i+"a",t("a_ot")+" AR",o.ar)}${F("o"+i+"e",t("a_ot")+" EN",o.en)}${F("o"+i+"da",t("a_ob")+" AR",o.dar)}${F("o"+i+"de",t("a_ob")+" EN",o.den)}${F("o"+i+"la",t("a_od")+" AR",o.lar)}${F("o"+i+"le",t("a_od")+" EN",o.len)}</div></div>`).join("")+`<button class="btn bp" id="osv">${t("a_save")}</button>`;
  $("#osv").onclick=()=>{DB.offers.forEach((o,i)=>{const v=k=>$("#o"+i+k).value.trim();Object.assign(o,{ar:v("a"),en:v("e"),dar:v("da"),den:v("de"),lar:v("la"),len:v("le")})});save();applyStatic();toast(t("a_saved"))}}
 else if(atab===3){const c=CONFIG;b.innerHTML=`<div class="two">${F("i_ha",t("a_hrs")+" AR",c.hours.ar)}${F("i_he",t("a_hrs")+" EN",c.hours.en)}${F("i_aa",t("a_adr")+" AR",c.address.ar)}${F("i_ae",t("a_adr")+" EN",c.address.en)}${F("i_ph",t("tel"),c.phone)}${F("i_wa",t("wa")+" (905xxxxxxxxx)",c.whatsapp)}${F("i_em",t("mail"),c.email)}${F("i_mp",t("a_maps"),c.maps)}${F("i_ig",t("a_ig"),c.social.instagram)}${F("i_fb",t("a_fb"),c.social.facebook)}</div><button class="btn bp" id="isv">${t("a_save")}</button>`;
  $("#isv").onclick=()=>{const v=k=>$("#"+k).value.trim();Object.assign(CONFIG,{hours:{ar:v("i_ha"),en:v("i_he")},address:{ar:v("i_aa"),en:v("i_ae")},phone:v("i_ph"),whatsapp:v("i_wa"),email:v("i_em"),maps:v("i_mp"),social:{instagram:v("i_ig"),facebook:v("i_fb")}});DB.config=JSON.parse(JSON.stringify(CONFIG));save();applyStatic();toast(t("a_saved"))}}
 else{b.innerHTML=`<p style="color:var(--tx2);margin-bottom:8px">${t("a_qrh")}</p>${F("qu",t("a_url"),CONFIG.menuUrl||(location.protocol.startsWith("http")?location.href.split("#")[0]:""))}<div class="btns"><button class="btn bp" id="qg">${ic("qr")} ${t("a_gen")}</button><button class="btn bo" id="qd">${t("a_dl")}</button><button class="btn bo" id="qp">${t("a_pr")}</button></div><div id="qbox" style="margin-top:14px;background:#fff;padding:14px;border-radius:12px;width:max-content;max-width:100%"></div>`;
  const gen=()=>{const u=$("#qu").value.trim();if(!u)return;$("#qbox").innerHTML="";if(window.QRCode)new QRCode($("#qbox"),{text:u,width:220,height:220});else toast(t("a_qrn"))};
  $("#qg").onclick=gen;$("#qd").onclick=()=>{const c=$("#qbox canvas");if(!c)return toast(t("a_qrn"));const a=document.createElement("a");a.download="enjoy-coffee-qr.png";a.href=c.toDataURL();a.click()};
  $("#qp").onclick=()=>{const c=$("#qbox canvas");if(!c)return;const w=open_print(c.toDataURL());};}}
function open_print(u){const w=window.open("","_blank");if(w){w.document.write(`<img src="${u}" style="width:320px;display:block;margin:40px auto" onload="print()">`);w.document.close()}}
$("#atabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b){atab=+b.dataset.t;editId=null;adm()}};

/* تحميل مكتبة QR عند الحاجة فقط */
(function(){const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.async=true;document.head.appendChild(s)})();
renderAll();scrollTo(0,0);dispatchEvent(new Event("scroll"));
/* if(SUPABASE.url){supaLoad();supaSubscribe();} */
</script>
